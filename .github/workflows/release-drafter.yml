name: release-drafter

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-drafter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve release draft version
        id: release-version
        run: node scripts/resolve-release-drafter-version.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_PUBLIC_GITHUB_TOKEN }}

      - uses: release-drafter/release-drafter@v6
        with:
          name: ${{ steps.release-version.outputs.name }}
          tag: ${{ steps.release-version.outputs.tag }}
          version: ${{ steps.release-version.outputs.version }}
          prerelease: ${{ steps.release-version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_PUBLIC_GITHUB_TOKEN }}
